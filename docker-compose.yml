version: "3.9"

services:

  api:
    build: .
    container_name: aqi-api
    restart: unless-stopped

    ports:
      - "8002:8000"

    environment:
      DATABASE_URL: postgresql://aqi:aqikrakow@aqi-postgres:5432/aqi

    networks:
      - aqi-network

networks:
  aqi-network:
    external: true