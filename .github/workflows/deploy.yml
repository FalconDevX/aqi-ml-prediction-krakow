name: Deploy API

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug SSH
        run: |
          echo "HOST EXISTS: ${{ secrets.SERVER_HOST != '' }}"
          echo "USER EXISTS: ${{ secrets.SERVER_USER != '' }}"
          echo "KEY EXISTS: ${{ secrets.SERVER_SSH_KEY != '' }}"

      - name: Check SSH key for CRLF
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if printf '%s' "$SSH_KEY" | grep -q $'\r'; then
            echo "PROBLEM: SERVER_SSH_KEY contains CRLF (Windows line endings) — re-paste the key in GitHub Secrets with LF only"
            exit 1
          else
            echo "OK: no CRLF in SSH key"
          fi

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script: |
            set -e

            echo "Going to project directory..."
            cd /root/AQI/aqi-ml-prediction-krakow || { echo "Directory not found"; exit 1; }

            echo "Current dir:"
            pwd
            ls -la

            echo "Pulling latest code..."
            git pull origin main

            echo "Stopping old containers..."
            docker compose down

            echo "Cleaning Docker (old images & cache)..."
            docker system prune -f

            echo "Rebuilding containers..."
            docker compose up -d --build

            echo "Removing dangling images..."
            docker image prune -f

            echo "Deploy done!"