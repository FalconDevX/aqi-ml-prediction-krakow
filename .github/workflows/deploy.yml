name: Deploy API

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H 46.225.27.182 >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes root@46.225.27.182 "echo SSH OK"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes root@46.225.27.182 /bin/bash -s <<-'EOF'
          set -e
          cd /root/AQI/aqi-ml-prediction-krakow
          git pull origin main
          docker compose down
          docker system prune -f
          docker compose up -d --build
          docker image prune -f
          echo "Deploy done!"

